services:
  mongodb:
    image: mongo:7.0
    container_name: spot_rag_mongo
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: spot_rag

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: spot_rag_qdrant
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  mongo-express:
    image: mongo-express:1.0.2
    container_name: spot_rag_mongo_express
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  mongo_data:
  qdrant_data:
