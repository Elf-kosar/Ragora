services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_NEW_ENGINE: "true"
    volumes:
      - ollama_data:/root/.ollama

  ollama-model-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull $$OLLAMA_MODEL;
      if [ \"$$OLLAMA_VISION_MODEL\" != \"$$OLLAMA_MODEL\" ]; then ollama pull $$OLLAMA_VISION_MODEL; fi"
    restart: "no"

  chatbot:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
      ollama-model-init:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    environment:
      MONGODB_URI: mongodb://mongo:27017/
      SPOT_MONGODB_URI: mongodb://mongo:27017/
      SPOT_MONGODB_DB_NAME: ${SPOT_MONGODB_DB_NAME:-Ragora}
      SPOT_MONGODB_COLLECTION: ${SPOT_MONGODB_COLLECTION:-spot_collection}
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: ${SPOT_MONGODB_DB_NAME:-Ragora}
      MONGO_COLLECTION: ${SPOT_MONGODB_COLLECTION:-spot_collection}
      QDRANT_MODE: server
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      SPOT_QDRANT_COLLECTION: ${SPOT_QDRANT_COLLECTION:-spot_chunks}
      QDRANT_COLLECTION: ${SPOT_QDRANT_COLLECTION:-spot_chunks}
      VISUAL_MONGO_COLLECTION: ${SPOT_VISUAL_MONGODB_COLLECTION:-spot_visual_collection}
      VISUAL_QDRANT_COLLECTION: ${SPOT_VISUAL_QDRANT_COLLECTION:-spot_visual_chunks}
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      EMBED_DEVICE: ${EMBED_DEVICE:-cpu}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      VISION_RETRIEVAL_MODE: ${VISION_RETRIEVAL_MODE:-clip}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.55}
      RETRIEVAL_K: ${RETRIEVAL_K:-4}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-3500}
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface
    volumes:
      - ./data:/app/data
      - ./spot-rag-project-son/spot-rag:/app/spot-rag-project-son/spot-rag:ro
      - ./spot-rag-project-son/spot-rag/data/pdfs:/app/chatbot/static/spot-pdfs:ro
      - hf_cache:/root/.cache/huggingface

  spot-indexer:
    build: .
    profiles:
      - tools
    depends_on:
      mongo:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      MONGODB_URI: mongodb://mongo:27017/
      SPOT_MONGODB_URI: mongodb://mongo:27017/
      SPOT_MONGODB_DB_NAME: ${SPOT_MONGODB_DB_NAME:-Ragora}
      SPOT_MONGODB_COLLECTION: ${SPOT_MONGODB_COLLECTION:-spot_collection}
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: ${SPOT_MONGODB_DB_NAME:-Ragora}
      MONGO_COLLECTION: ${SPOT_MONGODB_COLLECTION:-spot_collection}
      QDRANT_MODE: server
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      SPOT_QDRANT_COLLECTION: ${SPOT_QDRANT_COLLECTION:-spot_chunks}
      QDRANT_COLLECTION: ${SPOT_QDRANT_COLLECTION:-spot_chunks}
      VISUAL_MONGO_COLLECTION: ${SPOT_VISUAL_MONGODB_COLLECTION:-spot_visual_collection}
      VISUAL_QDRANT_COLLECTION: ${SPOT_VISUAL_QDRANT_COLLECTION:-spot_visual_chunks}
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-large}
      EMBED_DEVICE: ${EMBED_DEVICE:-cpu}
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./spot-rag-project-son/spot-rag:/app/spot-rag-project-son/spot-rag:ro
    command: ["python", "scripts/index_spot_native.py", "--mode", "hybrid", "--force"]
    restart: "no"

volumes:
  mongo_data:
  qdrant_data:
  ollama_data:
  hf_cache:
